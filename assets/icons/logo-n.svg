<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <defs>
    <linearGradient id="nvNavyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="nvEmeraldGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Left stroke of the N (navy) -->
  <path d="M14 84 L14 20 L30 20 L30 84 Z"
        fill="url(#nvNavyGrad)"/>

  <!-- Diagonal stroke (emerald) -->
  <path d="M30 20 L74 84 L58 84 L14 20 Z"
        fill="url(#nvEmeraldGrad)"/>

  <!-- Right stroke of the N (navy, split for the "book" cut) -->
  <path d="M74 20 L74 84 L58 84 L58 20 Z"
        fill="url(#nvNavyGrad)"/>

  <!-- Accent cap (white) top-right, mimicking the brand card -->
  <rect x="62" y="8" width="14" height="10" fill="#FFFFFF"/>
</svg>
