<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>My Bids - Novanest Labs</title>
  <link rel="stylesheet" href="../css/style.css" />

<body class="labs-body">
