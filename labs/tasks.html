<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Tasks - Novanest Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/labs.css" />
</head>
<body class="labs-body">

  <header class="labs-topbar">
    <a href="dashboard.html" class="labs-topbar__brand">NOVA<span>NEST</span> Labs</a>
    <nav class="labs-topbar__nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="tasks.html" class="is-active">Tasks</a>
      <a href="my-bids.html">My Bids</a>
      <a href="assignments.html">Assignments</a>
      <a href="earnings.html">Earnings</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="labs-topbar__user">
      <span style="color: #94A3B8;">Signed in as <strong data-labs-name style="color:#fff;">...</strong></span>
      <button data-labs-logout style="border: 1px solid rgba(255,255,255,0.2); color: #fff;">Logout</button>
    </div>
  </header>

  <main class="labs-main">
    <div class="labs-hero" style="background: linear-gradient(135deg, #1E3A8A, #0F172A); border: 1px solid #1E293B;">
      <h1>Open Tasks</h1>
      <p>Select a task to submit your bid and get to work.</p>
    </div>

    <div class="labs-filters">
      <input type="search" id="labs-filter-search" placeholder="Search by title..." />
      <select id="labs-filter-type">
        <option value="">All types</option>
        <option>Volunteer</option>
        <option>Paid</option>
      </select>
      <select id="labs-filter-cat">
        <option value="">All categories</option>
        <option>Education</option>
        <option>Finance</option>
        <option>Business</option>
        <option>Productivity</option>
        <option>Community</option>
        <option>Technology</option>
      </select>
    </div>

    <div id="labs-tasks-container">
      <div class="labs-card"><strong>Loading tasks...</strong></div>
    </div>
  </main>

  <div class="labs-toast" id="labs-toast"></div>

  <script type="module" src="../js/labs/auth.js"></script>
  <script type="module" src="../js/labs/tasks.js"></script>
</body>
</html>
