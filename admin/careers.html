<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Careers — Novanest Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">

  <main class="admin-main">
    <header class="admin-topbar">
      <h1 class="admin-topbar__title">Careers</h1>
      <div class="admin-topbar__user" data-admin-email>…</div>
    </header>

    <section class="admin-content">
      <div class="admin-page-head">
        <div>
          <h2>Career Opportunities</h2>
          <p>Create, edit, close or delete job posts. Only <strong>Open</strong> posts appear on the public careers page.</p>
        </div>
        <button class="btn btn--primary" id="btn-new-career">+ New Opportunity</button>
      </div>

      <div id="list-container">
        <div class="admin-empty"><strong>Loading…</strong></div>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal-backdrop" id="career-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modal-title">New Opportunity</h3>

      <form class="form" id="career-form" novalidate>
        <input type="hidden" id="c-id" />

        <div>
          <label for="c-title">Title *</label>
          <input id="c-title" type="text" required placeholder="e.g. Frontend Developer" />
        </div>

        <div>
          <label for="c-role">Role category</label>
          <select id="c-role">
            <option value="">— Choose —</option>
            <option>Developer</option>
            <option>Tutor</option>
            <option>Designer</option>
            <option>Advertiser / Marketer</option>
            <option>Content Creator</option>
            <option>Media / Video</option>
            <option>Business / Outreach</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label for="c-desc">Description</label>
          <textarea id="c-desc" placeholder="Short description of the role"></textarea>
        </div>

        <div>
          <label for="c-reqs">Requirements (one per line)</label>
          <textarea id="c-reqs" placeholder="Strong HTML/CSS/JS&#10;Familiar with Git&#10;Portfolio of real work"></textarea>
        </div>

        <div>
          <label for="c-status">Status</label>
          <select id="c-status">
            <option>Open</option>
            <option>Closed</option>
          </select>
        </div>

        <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
          <button type="submit" class="btn btn--primary">Save</button>
          <button type="button" class="btn btn--outline" id="c-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { renderSidebar } from "./../js/admin/sidebar.js";
    import "./../js/admin/auth.js";
    import "./../js/admin/careers.js";
    renderSidebar("careers.html");
  </script>
</body>
</html>
