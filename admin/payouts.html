<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Payouts - Novanest Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">

  <main class="admin-main">
    <header class="admin-topbar">
      <h1 class="admin-topbar__title">Payouts</h1>
      <div class="admin-topbar__user" data-admin-email>...</div>
    </header>

    <section class="admin-content">
      <div class="admin-page-head">
        <div>
          <h2>Member Payouts</h2>
          <p>Every payment you have logged to team members.</p>
        </div>
      </div>

      <div class="support-kpis" style="margin-bottom:1.5rem;">
        <div class="support-kpi support-kpi--accent">
          <div class="support-kpi__label">Total Paid</div>
          <div class="support-kpi__value" id="kpi-total">KSh 0</div>
        </div>
        <div class="support-kpi">
          <div class="support-kpi__label">Payouts Recorded</div>
          <div class="support-kpi__value" id="kpi-count">0</div>
        </div>
        <div class="support-kpi">
          <div class="support-kpi__label">Members Paid</div>
          <div class="support-kpi__value" id="kpi-members">0</div>
        </div>
        <div class="support-kpi support-kpi--warn">
          <div class="support-kpi__label">This Month</div>
          <div class="support-kpi__value" id="kpi-month">KSh 0</div>
        </div>
      </div>

      <div class="admin-toolbar">
        <input type="search" id="filter-search" placeholder="Search by member, reference, method..." />
      </div>

      <div id="payouts-container">
        <div class="admin-empty"><strong>Loading payouts...</strong></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { renderSidebar } from "./../js/admin/sidebar.js";
    import "./../js/admin/auth.js";
    import "./../js/admin/payouts.js";
    renderSidebar("payouts.html");
  </script>
</body>
</html>
