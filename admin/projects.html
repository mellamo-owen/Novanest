<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Projects — Novanest Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">

  <main class="admin-main">
    <header class="admin-topbar">
      <h1 class="admin-topbar__title">Projects</h1>
      <div class="admin-topbar__user" data-admin-email>…</div>
    </header>

    <section class="admin-content">

      <div class="admin-page-head">
        <div>
          <h2>Novanest Labs Projects</h2>
          <p>Manage everything that appears on the public Projects page.</p>
        </div>
        <button class="btn btn--primary" id="btn-new-project">+ Add Project</button>
      </div>

      <div class="admin-toolbar">
        <input type="search" id="filter-search" placeholder="Search by title…" />
        <select id="filter-status">
          <option value="">All statuses</option>
          <option>Concept</option>
          <option>In Development</option>
          <option>Live</option>
          <option>Archived</option>
        </select>
        <select id="filter-published">
          <option value="">All visibility</option>
          <option value="true">Published</option>
          <option value="false">Draft</option>
        </select>
      </div>

      <div id="projects-container">
        <div class="admin-empty">
          <strong>Loading…</strong>
        </div>
      </div>

    </section>
  </main>

  <!-- MODAL -->
  <div class="modal-backdrop" id="project-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modal-title">Add Project</h3>

      <form class="form" id="project-form" novalidate>
        <input type="hidden" id="p-id" name="id" />

        <div>
          <label for="p-title">Title *</label>
          <input id="p-title" name="title" type="text" required />
        </div>

        <div>
          <label for="p-description">Description</label>
          <textarea id="p-description" name="description"></textarea>
        </div>

        <div class="form__row form__row--2">
          <div>
            <label for="p-category">Category</label>
            <select id="p-category" name="category">
              <option value="">— Choose —</option>
              <option>Education</option>
              <option>Finance</option>
              <option>Business</option>
              <option>Productivity</option>
              <option>Community</option>
              <option>Technology</option>
            </select>
          </div>
          <div>
            <label for="p-status">Status</label>
            <select id="p-status" name="status">
              <option>Concept</option>
              <option>In Development</option>
              <option>Live</option>
              <option>Archived</option>
            </select>
          </div>
        </div>

        <div>
          <label for="p-tech">Technologies (comma-separated)</label>
          <input id="p-tech" name="technologies" type="text" placeholder="HTML, CSS, JavaScript" />
        </div>

        <div class="form__row form__row--2">
          <div>
            <label for="p-github">GitHub URL</label>
            <input id="p-github" name="github_url" type="url" placeholder="https://" />
          </div>
          <div>
            <label for="p-live">Live Demo URL</label>
            <input id="p-live" name="live_url" type="url" placeholder="https://" />
          </div>
        </div>

        <div>
          <label>Project Image</label>
          <div class="image-upload">
            <div class="image-upload__preview" id="image-preview">No image</div>
            <div>
              <input type="file" id="p-image" accept="image/*" />
              <div style="font-size:0.75rem;color:#6b7280;margin-top:0.3rem;">
                Recommended: 16:10 ratio, under 1 MB
              </div>
            </div>
          </div>
        </div>

        <div class="form__row form__row--2">
          <label style="display:flex;align-items:center;gap:0.4rem;font-weight:600;">
            <input type="checkbox" id="p-featured" /> Featured
          </label>
          <label style="display:flex;align-items:center;gap:0.4rem;font-weight:600;">
            <input type="checkbox" id="p-published" /> Published
          </label>
        </div>

        <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
          <button type="submit" class="btn btn--primary">Save Project</button>
          <button type="button" class="btn btn--outline" id="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { renderSidebar } from "./../js/admin/sidebar.js";
    import "./../js/admin/auth.js";
    import "./../js/admin/projects.js";
    renderSidebar("projects.html");
  </script>
</body>
</html>
